# Reguła świecowa B1 na świecach M5, instrument US500 (wariant "lanes", osobny od orb_index_cfd v1).
# Wartości przeniesione z research/candle_strategies.py (gałąź B1 funkcji `signals`, interwał M5), stan kodu `6c15bc8`.
# Ułamki i mnożniki są napisami (parsowane do Decimal); liczby TOML-float są odrzucane.
# Zmiana któregokolwiek pola zmienia regułę i tworzy NOWY wariant (zwiększa K, wymaga osobnej pre-rejestracji).
# Okna czasowe sygnałów, godzina spłaszczenia i koszty NIE leżą tutaj: robi to wywołujący (reguła to czysta funkcja).

instrument = "US500"
bar_minutes = 5                       # interwał świec (M5); koniec świecy sygnału = początek + bar_minutes
lookback_bars = 12                    # n: poprzednie zakończone świece tworzące zakres (bez bieżącej)
min_body_fraction = "0.60"            # korpus |c - o| >= 0,60 x zakres świecy sygnału
long_min_close_fraction = "0.75"      # long: zamknięcie w górnej ćwiartce zakresu (clv >= 0,75)
short_max_close_fraction = "0.25"     # short: zamknięcie w dolnej ćwiartce zakresu (clv <= 0,25)
spread_buffer_fraction = "0.25"       # bufor wybicia b = max(krok stopu, 0,25 x spread)
target_r = "1.5"                      # cel zysku = 1,5 x odległość stopu (R)
time_limit_min = 50                   # limit czasu pozycji w minutach (10 świec M5)
fixed_min_size_sessions = 5           # jak w v1: tyle pierwszych sesji pasma na minimalnej wielkości
